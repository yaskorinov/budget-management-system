# Оверлей для случая, когда прокси живёт на самом хосте и слушает только
# 127.0.0.1 (так ставит, например, vps-psiphon: открытый наружу SOCKS5 —
# это дыра, поэтому он публикует порт на loopback).
#
# У контейнера свой сетевой стек, и до такого прокси он не достучится:
#   127.0.0.1:1080        — это сам контейнер, там никого нет;
#   host.docker.internal  — шлюз docker0, но на нём прокси не слушает.
# Поэтому отдаём контейнеру сеть хоста: тогда 127.0.0.1 в PROXY_URL значит
# ровно то же, что и в curl -x на хосте.
#
#   docker compose -f docker-compose.yml -f deploy/docker-compose.proxy.yml up -d
#
# Чтобы не набирать это каждый раз, добавьте в .env строку
#   COMPOSE_FILE=docker-compose.yml:deploy/docker-compose.proxy.yml
# — тогда обычный docker compose up поднимает нужную связку сам.
#
# В host-режиме порт не публикуется — приложение само занимает HOST:PORT
# на хосте. Слушаем loopback, наружу пускает nginx (см. deploy/nginx.conf).
services:
  app:
    network_mode: host
    environment:
      HOST: 127.0.0.1
