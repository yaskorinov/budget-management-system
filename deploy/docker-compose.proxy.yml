# Прокси на хосте опубликован на шлюзе docker0 (172.17.0.1) — так делает,
# например, vps-psiphon.
#
#   docker compose -f docker-compose.yml -f deploy/docker-compose.proxy.yml up -d
#
# Зачем: compose поднимает боту собственную сеть, а Docker изолирует мосты друг
# от друга. Пакет к 172.17.0.1 из чужой сети молча отбрасывается — запрос виснет
# и падает по таймауту, хотя с самого хоста curl -x работает. Оверлей переводит
# бот на стандартный мост, откуда этот адрес доступен.
#
# После этого в .env: PROXY_URL=socks5://172.17.0.1:1080
#
# Публикация порта работает как прежде: наружу по-прежнему смотрит только
# 127.0.0.1:8080. Но собственной сети у контейнера больше нет, поэтому оверлей
# с Caddy к нему не подойдёт — он ходит к боту по имени. С nginx на хосте,
# который проксирует на 127.0.0.1:8080, всё в порядке.

services:
  app:
    network_mode: bridge

# Если и это не пройдёт, остаётся сеть хоста — тогда контейнер видит всё, что
# видит хост. Публикация портов при этом не работает: приложение само займёт
# порт из PORT, поэтому оставьте HOST=127.0.0.1, иначе оно окажется снаружи.
#
# services:
#   app:
#     network_mode: host
